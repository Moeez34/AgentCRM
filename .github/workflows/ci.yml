name: AgentCRM CI/CD Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Run Web Linting
        run: |
          cd web
          npm run lint

      - name: Build Web App
        run: |
          cd web
          # Skip lint/typescript errors during build for CI validation if needed, 
          # but we'll run a standard Next build.
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/agentcrm"
          NEXTAUTH_SECRET: "ci_testing_secret_key"
          NEXTAUTH_URL: "http://localhost:3000"

  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'worker/package.json'

      - name: Install Worker Dependencies
        run: |
          cd worker
          npm install

      - name: Compile Worker TypeScript
        run: |
          cd worker
          npm run build
